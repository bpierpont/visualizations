<style>
/* Layout: single reading column; bar chart then map, each a figure with caption. Deliberately single light theme (print-style figures). */
:root{
  color-scheme:light;
  --bg:#ffffff; --fg:#0b0b0b; --fg2:#52514e; --muted:#8a8984; --rule:#e6e5e0;
  --state:#e4e3df; --pipe:#8f8e89; --state-line:#ffffff;
  --gas:#86b6ef; --dc:#184f95;
  --font-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cc:#2a78d6; --gt:#eb6834; --ic:#1baf7a; --st:#eda100; --unk:#b5b4ae;
  --s-con:#2a78d6; --s-pre:#eb6834; --s-ann:#1baf7a;
  --m-ge:#2a78d6; --m-si:#eb6834; --m-mi:#1baf7a; --m-ca:#eda100; --m-ot:#e87ba4;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.sub{font-size:17px;font-weight:500;color:var(--fg2);margin-bottom:4px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
p{margin:0;color:var(--fg2)}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:10px}
.stat b{display:block;font-family:var(--font-display);font-size:28px;color:var(--fg);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--fg2)}
figure{margin:0;display:flex;flex-direction:column;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14.5px;color:var(--fg2);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;overflow-x:auto;position:relative}
svg text{font-family:var(--font-body)}
figcaption{font-size:13.5px;color:var(--muted);max-width:90ch}
.tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--rule);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.4;color:var(--fg);max-width:280px;z-index:10}
.tip[hidden]{display:none}
.tip .t{font-weight:600;margin-bottom:2px}
.tip .k{color:var(--fg2)}
.toggle{display:inline-flex;align-self:flex-start;border:1px solid var(--rule);border-radius:8px;padding:3px;gap:3px;background:var(--bg)}
.toggle button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--fg2);padding:6px 12px;border-radius:6px;cursor:pointer}
.toggle button:hover{color:var(--fg)}
.toggle button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toggle button:focus-visible{outline:2px solid var(--dc);outline-offset:1px}
.err{padding:16px;border:1px dashed var(--rule);color:var(--fg2);font-size:13px}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head>

<div class="wrap">
<header>
  <h1>U.S. proposed and under-construction gas power plants</h1>
  <div class="sub">Based on Global Energy Monitor August 2026 Data</div>
  <p>Units in the United States with status announced, pre-construction, or construction whose fuel includes fossil gas. Operating, cancelled, shelved, mothballed, and retired units are excluded.</p>
  <div class="stats" id="stats"></div>
</header>

<figure>
  <h2>Capacity by expected start year</h2>
  <div class="legend"><span><i class="sw" style="background:var(--dc)"></i>Data center related</span><span><i class="sw" style="background:var(--gas)"></i>All other proposed gas</span></div>
  <div class="chart" id="bar"></div>
  <figcaption>GW by "Start year." "No date" = units with no start year listed (no units list a year after 2040). The toggle switches every chart to data center related units only; the y-axis rescales. Data center related = "Captive industry type" contains "data center" or "cryptocurrency" (crypto is ~0.35 GW).</figcaption>
</figure>

<figure>
  <h2>Capacity by technology and expected start year</h2>
  <div class="legend" id="techleg"></div>
  <div class="chart" id="tech"></div>
  <figcaption>GW by GEM "Turbine/Engine Technology." Unknown / other includes units listed as unknown and 1.4 GW of Allam-Fetvedt Cycle units (all plants). "No date" = units with no start year listed.</figcaption>
</figure>

<figure>
  <h2>Capacity by status and expected start year</h2>
  <div class="legend" id="statusleg"></div>
  <div class="chart" id="status"></div>
  <figcaption>GW by GEM "Status." All plants: construction 49.8 GW, pre-construction 216.9 GW, announced 102.7 GW. Data center related: construction 14.6 GW, pre-construction 118.6 GW, announced 48.4 GW. "No date" = units with no start year listed.</figcaption>
</figure>

<figure>
  <h2>Capacity by equipment manufacturer and expected start year</h2>
  <div class="legend" id="mfrleg"></div>
  <div class="chart" id="mfr"></div>
  <figcaption>GW by manufacturer, parsed from GEM "Equipment Manufacturer/Model" (text before the colon; model ignored). GE, GE Power, and GE Vernova are combined as GE Vernova; Mitsubishi Heavy Industries is combined with Mitsubishi Power. "Not reported" = blank, "not found," or "unknown" (214.4 GW of all plants; 101.1 GW of data center related). Other named manufacturers (26.1 GW of all plants): Baker Hughes, INNIO Jenbacher, Solar Turbines, Rolls-Royce, Wärtsilä, Bergen, ProEnergy, Doosan Enerbility, Everllence (MAN), APR Energy, Cummins, Enchanted Rock, MTU, and one unit listing two manufacturers. "No date" = units with no start year listed.</figcaption>
</figure>

<figure>
  <h2>Where the proposals are</h2>
  <div class="legend"><span><i class="sw" style="background:var(--dc);border-radius:50%"></i>Plant with data center related units</span><span><i class="sw" style="background:var(--gas);border-radius:50%"></i>Other proposed gas plant</span><span><i class="sw" style="background:var(--pipe);height:2px;width:18px;border-radius:0;vertical-align:4px"></i>Interstate gas pipeline</span><span id="sizeleg"></span></div>
  <div class="chart" id="map"></div>
  <figcaption>One bubble per plant (GEM location ID), sized by area to total proposed and under-construction gas capacity summed across units. A plant is shaded dark if any of its units is data center related. Some coordinates are GEM "approximate" locations. Grey lines are operating interstate natural gas pipelines (intrastate pipelines not shown), from the pipeline shapefile provided; lines are simplified for display. Hover a bubble for details.</figcaption>
</figure>
<figcaption>Source: Global Energy Monitor, Global Oil and Gas Plant Tracker, August 2026 release (CC BY 4.0). "Gas & Oil Units" sheet only; IRP-planned and sub-threshold units not included.</figcaption>
</div>

  function draw(mode){
    host.innerHTML = ''; hideTip();
    const src = mode === 'dc' ? dataDC : dataAll;
    const byBin = {}; src.forEach(b => byBin[b.bin] = b);
    const rows = BINS.map(k => { const o = {bin:k}; S.forEach(s => o[s.k] = ((byBin[k]||{})[s.k]||0)/1000); return o; });
    const svg = d3.select(host).append('svg').attr('viewBox',`0 0 ${W} ${H}`).style('width','100%').style('min-width','640px').style('display','block');
    const x = d3.scale.ordinal().domain(BINS).rangeBands([m.l, W-m.r], 0.22);
    const tot = r => d3.sum(S, s => r[s.k]);
    const y = d3.scale.linear().domain([0, Math.max(10, Math.ceil(d3.max(rows, tot)/10)*10)]).range([H-m.b, m.t]);
    y.ticks(5).forEach(t => {
      svg.append('line').attr({x1:m.l, x2:W-m.r, y1:y(t), y2:y(t), stroke:C.rule});
      svg.append('text').attr({x:m.l-8, y:y(t)+4, 'text-anchor':'end', 'font-size':14, fill:C.fg2}).text(t);
    });
    svg.append('text').attr({x:m.l-36, y:m.t-10, 'font-size':14, fill:C.fg2}).text('GW');
    rows.forEach(r => {
      const bx = x(r.bin), bw = x.rangeBand(), T = tot(r); let acc = 0;
      S.forEach(s => { const v = r[s.k]; if (v <= 0) return;
        const y1 = y(acc + v), y0 = y(acc); acc += v;
        svg.append('rect').attr({x:bx, width:bw, y:y1, height:Math.max(0.5, y0 - y1), fill:s.c}).attr('stroke', C.bg).attr('stroke-width', 1);
      });
      if (T > 0) svg.append('text').attr({x:bx+bw/2, y:y(T)-6, 'text-anchor':'middle', 'font-size':14, fill:C.fg}).text(fmt(T));
      svg.append('text').attr({x:bx+bw/2, y:H-m.b+20, 'text-anchor':'middle', 'font-size':14, fill:C.fg2}).text(label(r.bin));
      svg.append('rect').attr({x:bx-bw*0.11, width:bw*1.22, y:m.t, height:H-m.b-m.t, fill:'transparent'})
        .on('mousemove', function(){ showTip(`<div class="t">${label(r.bin)}${mode==='dc'?' · data center related':''}</div>` + S.slice().reverse().filter(s => r[s.k] > 0).map(s => `<div><i class="sw" style="background:${s.c};width:9px;height:9px"></i>${s.n}: ${fmt(r[s.k])} GW</div>`).join('') + `<div><span class="k">Total:</span> ${fmt(T)} GW</div>`, d3.event); })
        .on('mouseleave', hideTip);
    });
    svg.append('line').attr({x1:m.l, x2:W-m.r, y1:y(0), y2:y(0), stroke:C.fg2});
    const t = d3.sum(rows, tot);
    svg.append('text').attr({x:W-m.r, y:m.t-6, 'text-anchor':'end', 'font-size':14, fill:C.fg2}).text(`${mode==='dc'?'Data center related':'All proposed plants'}: ${fmt(t)} GW`);
  }
  tg.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    tg.querySelectorAll('button').forEach(b2 => b2.setAttribute('aria-pressed', String(b2 === btn)));
    draw(btn.id.endsWith('-dc') ? 'dc' : 'all');
  }));
  draw('all');
}
stacked('bar', [{k:'dc',n:'Data center related',c:C.dc},{k:'other',n:'All other proposed gas',c:C.gas}], DATA.bars, zeroOther);
stacked('tech', [{k:'cc',n:'Combined cycle',c:css('--cc')},{k:'gt',n:'Gas turbine (simple cycle)',c:css('--gt')},{k:'ic',n:'Internal combustion engine',c:css('--ic')},{k:'st',n:'Steam turbine',c:css('--st')},{k:'unk',n:'Unknown / other',c:css('--unk')}], DATA.tech, DATA.tech_dc);
stacked('status', [{k:'con',n:'Construction',c:css('--s-con')},{k:'pre',n:'Pre-construction',c:css('--s-pre')},{k:'ann',n:'Announced',c:css('--s-ann')}], DATA.status, DATA.status_dc);
stacked('mfr', [{k:'ge',n:'GE Vernova',c:css('--m-ge')},{k:'si',n:'Siemens Energy',c:css('--m-si')},{k:'mi',n:'Mitsubishi Power',c:css('--m-mi')},{k:'ca',n:'Caterpillar',c:css('--m-ca')},{k:'ot',n:'Other manufacturers',c:css('--m-ot')},{k:'nr',n:'Not reported',c:css('--unk')}], DATA.mfr, DATA.mfr_dc);

// ---- map
(function(){
  const el = document.getElementById('map');
  const topo = window.Datamap && Datamap.prototype.usaTopo;
  if (!topo || !window.topojson) { el.innerHTML = '<div class="err">The state basemap could not load (it comes from cdnjs). Reload the page to try again.</div>'; return; }
  const W = 1060, H = 620;
  const proj = d3.geo.albersUsa().scale(1340).translate([W/2, H/2]);
  const path = d3.geo.path().projection(proj);
  const svg = d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`).style('width','100%').style('min-width','560px').style('display','block');
  const objName = Object.keys(topo.objects)[0];
  const states = topojson.feature(topo, topo.objects[objName]).features;
  svg.append('g').selectAll('path').data(states).enter().append('path').attr('d', path).attr({fill:C.state, stroke:C.sl, 'stroke-width':1});
  svg.append('path').datum(PIPES).attr('d', path).attr({fill:'none', stroke:css('--pipe'), 'stroke-width':0.6, 'stroke-linejoin':'round', 'stroke-linecap':'round'}).style('pointer-events','none');
  const maxMW = d3.max(DATA.plants, p => p.mw);
  const r = d3.scale.sqrt().domain([0, maxMW]).range([0, 26]);
  const pts = DATA.plants.map(p => { const xy = proj([p.lon, p.lat]); return xy ? Object.assign({x:xy[0], y:xy[1]}, p) : null; }).filter(Boolean);
  pts.sort((a,b) => b.mw - a.mw);
  svg.append('g').selectAll('circle').data(pts).enter().append('circle')
    .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => Math.max(2.5, r(d.mw)))
    .attr('fill', d => d.dc ? C.dc : C.gas).attr('fill-opacity', 0.85)
    .attr('stroke', C.bg).attr('stroke-width', 1)
    .on('mousemove', function(d){ d3.select(this).attr('stroke', C.fg).attr('stroke-width', 1.5);
      showTip(`<div class="t">${d.plant}</div><div class="k">${d.state}</div><div><span class="k">Proposed gas:</span> ${fmt0(d.mw)} MW (${d.units} unit${d.units>1?'s':''})</div><div><span class="k">Status:</span> ${d.status}</div><div><span class="k">Earliest start year:</span> ${d.year || 'none listed'}</div>${d.owner?`<div><span class="k">Owner:</span> ${d.owner}</div>`:''}<div><span class="k">Data center related:</span> ${d.dc?'yes':'no'}</div>${d.acc==='approximate'?'<div class="k">Approximate location</div>':''}`, d3.event); })
    .on('mouseleave', function(){ d3.select(this).attr('stroke', C.bg).attr('stroke-width', 1); hideTip(); });
  // size legend
  const sizes = [500, 2000, 8000], lw = 160, lh = 76;
  const ls = d3.select('#sizeleg').append('svg').attr({width:lw, height:lh}).style('vertical-align','middle');
  sizes.forEach((s,i) => { const rr = r(s), cx = 30 + i*44; ls.append('circle').attr({cx:cx, cy:lh-18-rr, r:rr, fill:'none', stroke:C.fg2});
    ls.append('text').attr({x:cx, y:lh-3, 'text-anchor':'middle', 'font-size':12.5, fill:C.fg2}).text(s>=1000? (s/1000)+' GW' : s+' MW'); });
  const dropped = DATA.plants.length - pts.length;
  if (dropped) el.insertAdjacentHTML('afterend', `<figcaption>${dropped} plant(s) fall outside the map projection and are not shown.</figcaption>`);
})();
</script>
